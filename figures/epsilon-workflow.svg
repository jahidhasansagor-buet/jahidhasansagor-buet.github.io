<svg viewBox="0 0 830 1010" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22272b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #22272b; stroke-width: 1.4; }
    .arrow { fill: none; stroke: #22272b; stroke-width: 1.4; marker-end: url(#ah); }
    .line { fill: none; stroke: #22272b; stroke-width: 1.4; }
    .nt { font-size: 12px; fill: #22272b; text-anchor: middle; }
    .lb { font-size: 10.5px; fill: #5a6570; }
    .red { font-size: 12px; font-weight: 600; fill: #8f2d16; }
    .yn { font-size: 10.5px; fill: #22272b; font-weight: 600; }
  </style>

  <!-- input label -->
  <text class="lb" x="25" y="38">System properties</text>
  <text class="lb" x="25" y="52">Norm-conserving pseudopotential</text>
  <path class="arrow" d="M 200 46 L 236 46"/>

  <!-- A: Structure optimization -->
  <rect class="box" x="240" y="26" width="180" height="40"/>
  <text class="nt" x="330" y="42">Structure optimization</text>
  <text class="nt" x="330" y="57">(PWscf package)</text>

  <path class="arrow" d="M 330 66 L 330 114"/>
  <text class="lb" x="338" y="94">Equilibrium atomic positions and lattice constant</text>

  <!-- A right branch to KS #1 -->
  <path class="arrow" d="M 420 46 L 585 46 L 585 228 L 424 228"/>
  <text class="lb" x="452" y="200">Equilibrium atomic positions</text>

  <!-- B: CPMD -->
  <rect class="box" x="240" y="118" width="180" height="40"/>
  <text class="nt" x="330" y="134">CPMD</text>
  <text class="nt" x="330" y="149">(CP package)</text>

  <path class="arrow" d="M 330 158 L 330 204"/>
  <text class="lb" x="338" y="185">Lattice constant at T &gt; 0 K</text>

  <!-- B feedback to KS #2 -->
  <path class="arrow" d="M 240 138 L 70 138 L 70 682 L 236 682"/>
  <text class="lb" x="78" y="674">Lattice constant at T &gt; 0 K</text>

  <!-- C: KS equations #1 -->
  <rect class="box" x="240" y="208" width="180" height="40"/>
  <text class="nt" x="330" y="224">KS equations</text>
  <text class="nt" x="330" y="239">(PWscf package)</text>

  <path class="arrow" d="M 330 248 L 330 294"/>
  <text class="lb" x="338" y="275">KS eigenvalues and eigenfunctions</text>

  <!-- D: DFPT -->
  <rect class="box" x="240" y="298" width="180" height="40"/>
  <text class="nt" x="330" y="314">DFPT</text>
  <text class="nt" x="330" y="329">(PHonon package)</text>

  <path class="arrow" d="M 420 318 L 458 318"/>
  <text class="red" x="464" y="314">Harmonic phonon</text>
  <text class="red" x="464" y="329">dispersion</text>

  <path class="arrow" d="M 330 338 L 330 374"/>
  <text class="lb" x="338" y="360">Harmonic force constants</text>

  <!-- E: diamond imaginary frequencies -->
  <polygon class="box" points="330,378 428,410 330,442 232,410"/>
  <text class="nt" x="330" y="407">Imaginary phonon</text>
  <text class="nt" x="330" y="421">frequencies?</text>

  <!-- E Yes branch -->
  <path class="arrow" d="M 428 410 L 546 410"/>
  <text class="yn" x="440" y="402">Yes</text>
  <text class="lb" x="434" y="444">Unstable force constants</text>

  <rect class="box" x="550" y="390" width="110" height="40"/>
  <text class="nt" x="605" y="406">ASDM</text>
  <text class="nt" x="605" y="421">(EPW)</text>

  <path class="arrow" d="M 605 430 L 605 456"/>
  <text class="lb" x="613" y="450">Relaxation input file</text>

  <rect class="box" x="505" y="460" width="200" height="42"/>
  <text class="nt" x="605" y="477">Atomic-coordinate</text>
  <text class="nt" x="605" y="492">optimization (PWscf)</text>

  <path class="arrow" d="M 605 502 L 605 526"/>
  <text class="lb" x="613" y="519">Stable polymorphous structure</text>

  <rect class="box" x="505" y="530" width="200" height="42"/>
  <text class="nt" x="605" y="547">Finite-displacement</text>
  <text class="nt" x="605" y="562">approach (EPW)</text>

  <path class="arrow" d="M 605 572 L 605 596"/>
  <text class="lb" x="613" y="589">Stable force constants</text>

  <!-- E No down -->
  <path class="arrow" d="M 330 442 L 330 466"/>
  <text class="yn" x="338" y="460">No</text>

  <!-- G: diamond treatment -->
  <polygon class="box" points="330,470 448,512 330,554 212,512"/>
  <text class="nt" x="330" y="502">Harmonic or</text>
  <text class="nt" x="330" y="516">anharmonic</text>
  <text class="nt" x="330" y="530">treatment?</text>

  <!-- G Harmonic to SDM -->
  <path class="arrow" d="M 212 512 L 150 512 L 150 596"/>
  <text class="yn" x="130" y="504">Harmonic</text>
  <rect class="box" x="75" y="600" width="150" height="42"/>
  <text class="nt" x="150" y="617">SDM</text>
  <text class="nt" x="150" y="632">(EPW)</text>

  <!-- G Anharmonic to ASDM main -->
  <path class="arrow" d="M 448 512 L 500 512 L 500 596"/>
  <text class="yn" x="424" y="528">Anharmonic</text>
  <rect class="box" x="475" y="600" width="150" height="42"/>
  <text class="nt" x="550" y="617">ASDM</text>
  <text class="nt" x="550" y="632">(EPW+PWscf)</text>

  <path class="arrow" d="M 550 642 L 550 658 L 330 658 L 330 676"/>
  <path class="line" d="M 150 642 L 150 658 L 330 658"/>
  <text class="lb" x="200" y="653">Atomic positions at T &gt; 0 K</text>

  <!-- ASDM red output -->
  <path class="arrow" d="M 625 621 L 662 621"/>
  <text class="red" x="666" y="617">Anharmonic phonon</text>
  <text class="red" x="666" y="632">dispersion</text>

  <!-- I: KS equations #2 -->
  <rect class="box" x="240" y="680" width="180" height="40"/>
  <text class="nt" x="330" y="696">KS equations</text>
  <text class="nt" x="330" y="711">(PWscf package)</text>

  <path class="arrow" d="M 420 700 L 458 700"/>
  <text class="red" x="464" y="704">Renormalized band gap at T &gt; 0 K</text>

  <path class="arrow" d="M 330 720 L 330 748"/>
  <text class="lb" x="338" y="740">KS eigenvalues and eigenfunctions at T &gt; 0 K</text>

  <!-- J: diamond e-h interactions -->
  <polygon class="box" points="330,752 448,789 330,826 212,789"/>
  <text class="nt" x="330" y="786">Include electron&#8211;</text>
  <text class="nt" x="330" y="800">hole interactions?</text>

  <!-- J No branch -->
  <path class="arrow" d="M 212 789 L 140 789 L 140 838"/>
  <text class="yn" x="164" y="781">No</text>
  <rect class="box" x="55" y="842" width="170" height="56"/>
  <text class="nt" x="140" y="860">Linear-response</text>
  <text class="nt" x="140" y="874">theory, independent</text>
  <text class="nt" x="140" y="888">particles</text>

  <!-- J Yes branch -->
  <path class="arrow" d="M 448 789 L 545 789 L 545 820"/>
  <text class="yn" x="456" y="781">Yes</text>
  <rect class="box" x="460" y="824" width="170" height="40"/>
  <text class="nt" x="545" y="840">GW approximation</text>
  <text class="nt" x="545" y="855">(Yambo)</text>

  <path class="arrow" d="M 545 864 L 545 886"/>
  <rect class="box" x="460" y="890" width="170" height="40"/>
  <text class="nt" x="545" y="906">Bethe&#8211;Salpeter equation</text>
  <text class="nt" x="545" y="921">(Yambo)</text>

  <!-- converge to output -->
  <path class="arrow" d="M 140 898 L 140 967 L 236 967"/>
  <path class="arrow" d="M 545 930 L 545 967 L 454 967"/>
  <rect class="box" x="240" y="945" width="210" height="44"/>
  <text class="nt" x="345" y="963">Real and imaginary parts</text>
  <text class="nt" x="345" y="978">of the dielectric tensor</text>
</svg>
